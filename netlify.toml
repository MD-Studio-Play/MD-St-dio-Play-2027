[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/mercadopago/create-pix"
  to = "/.netlify/functions/create-pix"
  status = 200

[[redirects]]
  from = "/api/create-pix"
  to = "/.netlify/functions/create-pix"
  status = 200

[[redirects]]
  from = "/api/create-pix-payment"
  to = "/.netlify/functions/create-pix"
  status = 200

[[redirects]]
  from = "/api/mercadopago/create-checkout-pro"
  to = "/.netlify/functions/create-checkout-pro"
  status = 200

[[redirects]]
  from = "/api/mercadopago/create-order"
  to = "/.netlify/functions/create-checkout-pro"
  status = 200

[[redirects]]
  from = "/api/create-payment"
  to = "/.netlify/functions/create-checkout-pro"
  status = 200

[[redirects]]
  from = "/api/mercadopago/verify-order"
  to = "/.netlify/functions/verify-order"
  status = 200

[[redirects]]
  from = "/api/mercadopago/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

[[redirects]]
  from = "/api/webhook/mercadopago"
  to = "/.netlify/functions/webhook"
  status = 200

[[redirects]]
  from = "/api/mercadopago/order-status/:id"
  to = "/.netlify/functions/order-status?id=:id"
  status = 200

[[redirects]]
  from = "/api/mercadopago/test-connection"
  to = "/.netlify/functions/test-connection"
  status = 200

[[redirects]]
  from = "/api/whatsapp/send-otp"
  to = "/.netlify/functions/send-otp"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
